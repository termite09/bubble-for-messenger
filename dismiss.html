<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; height: 100vh; }
    #target {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(40, 40, 40, 0.9); box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
      display: flex; align-items: center; justify-content: center;
      transition: transform .12s ease, background .12s ease;
    }
    #target svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.5; fill: none; }
    body.hot #target { transform: scale(1.35); background: #ff3b30; }
  </style>
</head>
<body>
  <div id="target">
    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </div>
  <script src="dismiss-renderer.js"></script>
</body>
</html>
