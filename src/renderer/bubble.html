<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <style>
    /* The stack's deploy is one number: --p runs 0→1 and every banner derives its offset and
       opacity from it, so the fan opens as a single linked motion rather than five cards. */
    @property --p { syntax: '<number>'; inherits: true; initial-value: 0; }

    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
    body {
      --card: #1c1c1e; --raised: #2c2c2e; --ink: #f5f5f7; --dim: #8e8e93; --rule: rgba(255,255,255,.12); --blue: #0a84ff;
      --lift: 0 8px 24px rgba(0,0,0,.45);
      --ease: cubic-bezier(.22, 1, .36, 1); /* ease-out-quint: fast start, long settle, no overshoot */
      font: 13px/16px -apple-system, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
      position: relative; width: 100vw; height: 100vh;
    }
    img { -webkit-user-drag: none; pointer-events: none; }

    /* #content is the disc column; the main process positions it inside the padded window
       and tells us which screen edge the disc rests on so banners extend the other way. */
    #content { position: absolute; display: flex; flex-direction: column; }
    body.up #content { flex-direction: column; justify-content: flex-end; }
    body.down #content { flex-direction: column-reverse; justify-content: flex-end; }
    body.edge-right #content { align-items: flex-end; }
    body.edge-left #content { align-items: flex-start; }

    .card { background: var(--card); border: 1px solid var(--rule); box-shadow: var(--lift); box-sizing: border-box; }

    /* ---- The disc ------------------------------------------------------------------------ */
    #disc {
      position: relative; width: 44px; height: 44px; border-radius: 22px; flex: none;
      display: flex; align-items: center; justify-content: center; cursor: default;
    }
    #disc img { width: 24px; height: 24px; display: block; }
    #count {
      position: absolute; right: -8px; top: -6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
      border-radius: 9px; background: var(--blue); color: #fff; font: 600 11px/18px -apple-system, system-ui, sans-serif;
      text-align: center; display: none; pointer-events: none;
    }
    #count.visible { display: block; }
    /* Pulsing count: the pill breathes between full and a third while anything is unread. */
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    body.pulse #count.visible { animation: breathe 2.4s ease-in-out infinite; }

    /* "A message landed": a banner unrolls out of the disc for a few seconds, then rolls back.
       It is a full-size card whose clip-path starts as the disc's own circle, so the reveal is
       one element growing along the panel side with no layout work. */
    #landed {
      position: absolute; top: -1px; width: 252px; height: 44px; border-radius: 22px;
      display: flex; align-items: center; gap: 10px; padding: 0 14px 0 5px;
      transition: clip-path 220ms var(--ease), opacity 120ms linear; opacity: 0; pointer-events: none;
    }
    body.landed #landed { pointer-events: auto; }
    #landed:hover { background: var(--raised); }
    body.edge-right #landed { right: -1px; clip-path: inset(0 0 0 208px round 22px); }
    body.edge-left #landed { left: -1px; clip-path: inset(0 208px 0 0 round 22px); }
    body.landed #landed { clip-path: inset(0 round 22px); opacity: 1; }
    body.landed #count { display: none; }

    /* ---- Heads ---------------------------------------------------------------------------- */
    #fan { display: flex; flex-direction: column; gap: 8px; --p: 0; transition: --p 220ms var(--ease); }
    body.up #fan { margin-bottom: 8px; }
    body.down #fan { margin-top: 8px; }
    body.open #fan { --p: 1; }
    body.edge-right #fan { align-items: flex-end; }
    body.edge-left #fan { align-items: flex-start; }
    /* Newest at the top, Open Messenger at the bottom, whichever side of the disc the stack is on. */
    .head {
      position: relative; width: 44px; height: 44px; border-radius: 22px; cursor: default; flex: none;
      /* --d: this head's distance to the disc; at p=0 it sits folded under the disc, unseen */
      transform: translateY(calc((1 - var(--p)) * var(--d)));
      opacity: var(--p);
    }
    .head img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .head .initial { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font: 600 15px -apple-system, system-ui, sans-serif; }
    /* Open Messenger is the one paper disc in the column, so it never reads as another contact. */
    .head.inbox { background: var(--ink); }
    .head.inbox img { width: 24px; height: 24px; margin: 9px; border-radius: 0; }
    .head:hover { border-color: rgba(255,255,255,.28); }
    /* The open conversation: a paper ring outside the hairline. */
    .head.active { box-shadow: var(--lift), 0 0 0 2px var(--ink); }
    .dot {
      position: absolute; right: -1px; top: -1px; width: 12px; height: 12px; border-radius: 6px; background: var(--blue);
      border: 2px solid var(--card); box-sizing: border-box; display: none;
    }
    .unread .dot { display: block; }

    /* Landed-banner internals */
    .av { width: 32px; height: 32px; border-radius: 16px; flex: none; overflow: hidden; background: #3a3a3c;
          display: flex; align-items: center; justify-content: center; font: 600 13px -apple-system, system-ui, sans-serif; color: #fff; }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 12px; line-height: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-size: 11px; color: var(--dim); flex: none; }

    /* Reply: ↩ at the banner's far end swaps the first line for a field. The field is the
       only thing in the app that ever holds keyboard focus. */
    #landed-reply {
      flex: none; width: 24px; height: 24px; margin-right: -6px; border: 0; border-radius: 12px; padding: 0;
      background: transparent; color: var(--dim); font: 14px/24px -apple-system, system-ui, sans-serif; cursor: default;
    }
    #landed-reply:hover { background: var(--rule); color: var(--ink); }
    /* While replying the banner grows a second row: the field runs the banner's width under the
       name, a raised pill of its own so it reads as a place to type. The main process grows the
       window by the same row (REPLY_ROW in bubble.js) so nothing is clipped. */
    #landed-input {
      display: none; box-sizing: border-box; margin: 0; padding: 0 10px; border: 1px solid var(--rule); border-radius: 13px; outline: 0;
      height: 26px; background: var(--raised); color: var(--ink); font: 13px/24px -apple-system, system-ui, sans-serif;
      -webkit-user-select: text; user-select: text; caret-color: var(--ink);
    }
    #landed-input::placeholder { color: var(--dim); }
    #landed-input::selection { background: rgba(255,255,255,.24); }
    #landed-input:focus { border-color: rgba(255,255,255,.28); }
    body.replying #landed-sub, body.replying #landed .time, body.replying #landed-reply { display: none; }
    body.replying #landed {
      height: 88px; display: grid; grid-template-columns: 32px 1fr; grid-template-rows: 44px 36px;
      column-gap: 10px; align-items: center;
    }
    body.replying #landed .av { grid-row: 1; grid-column: 1; }
    body.replying #landed .text { grid-row: 1; grid-column: 2; }
    body.replying #landed-input { display: block; grid-row: 2; grid-column: 1 / -1; margin: 0 0 14px 9px; }
    body.replying #landed:hover { background: var(--card); }
    body.sending #landed-reply { display: none; }
    body.no-reply #landed-reply { display: none; }

    /* Reduce Motion: no travel, just the crossfade. */
    @media (prefers-reduced-motion: reduce) {
      body.pulse #count.visible { animation: none; }
      #fan { transition: --p 120ms linear; }
      .head { transform: none; }
      #landed { transition: opacity 120ms linear; }
      body.edge-right #landed, body.edge-left #landed { clip-path: inset(0 round 22px); }
    }
  </style>
</head>
<body class="up edge-right">
  <div id="content">
    <div id="fan"></div>
    <div id="disc" class="card">
      <img src="../../assets/icon.png" alt="">
      <div id="count"></div>
      <div id="landed" class="card">
        <div class="av" id="landed-av"></div>
        <div class="text">
          <div class="name" id="landed-name"></div>
          <div class="sub" id="landed-sub"></div>
        </div>
        <input id="landed-input" type="text" maxlength="2000" autocomplete="off" spellcheck="true">
        <div class="time">now</div>
        <button id="landed-reply" type="button" title="Reply" aria-label="Reply">&#x21A9;</button>
      </div>
    </div>
  </div>
  <script src="bubble-renderer.js"></script>
</body>
</html>
