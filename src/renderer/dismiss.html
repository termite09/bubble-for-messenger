<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      /* Same card language as the bubble layer; arming it inverts the card rather than turning red. */
      #target {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 28px;
        box-sizing: border-box;
        background: #1c1c1e;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.12s linear;
      }
      #target svg {
        width: 22px;
        height: 22px;
        stroke: #f5f5f7;
        stroke-width: 2;
        fill: none;
        transition: stroke 0.12s linear;
      }
      /* Arming: a paper ring fills around the target over the arming time; then it inverts. */
      #target::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: conic-gradient(#f5f5f7 var(--fill, 0%), transparent 0);
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3px),
          #000 calc(100% - 2px)
        );
        opacity: 0;
      }
      body.arming #target::before {
        opacity: 1;
        animation: fill 350ms linear forwards;
      }
      @property --fill {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }
      @keyframes fill {
        to {
          --fill: 100%;
        }
      }
      body.hot #target {
        transform: scale(1.2);
        background: #f5f5f7;
      }
      body.hot #target svg {
        stroke: #1c1c1e;
      }
      @media (prefers-reduced-motion: reduce) {
        #target {
          transition: background 0.12s linear;
        }
        body.hot #target {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="target">
      <svg viewBox="0 0 24 24">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </div>
    <script src="dismiss-renderer.js"></script>
  </body>
</html>
