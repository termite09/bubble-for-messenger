<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      /* Same card language as the bubble layer; arming it inverts the card rather than turning red. */
      #target {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 28px;
        box-sizing: border-box;
        background: var(--card);
        border: 1px solid var(--rule);
        box-shadow: var(--lift);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 220ms var(--ease),
          background 120ms linear;
      }
      #target svg {
        width: 22px;
        height: 22px;
        stroke: var(--ink);
        stroke-width: 2;
        fill: none;
        transition: stroke 120ms linear;
      }
      /* Arming: a paper ring fills around the target over the arming time; then it inverts. */
      #target::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: conic-gradient(var(--ink) var(--fill, 0%), transparent 0);
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3px),
          black calc(100% - 2px)
        );
        opacity: 0;
      }
      body.arming #target::before {
        opacity: 1;
        animation: fill 350ms linear forwards;
      }
      @property --fill {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }
      @keyframes fill {
        to {
          --fill: 100%;
        }
      }
      body.hot #target {
        transform: scale(1.2);
        background: var(--ink);
      }
      body.hot #target svg {
        stroke: var(--card);
      }
      @media (prefers-reduced-motion: reduce) {
        #target {
          transition: background 120ms linear;
        }
        body.hot #target {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="target">
      <svg viewBox="0 0 24 24">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </div>
    <script src="dismiss-renderer.js"></script>
  </body>
</html>
