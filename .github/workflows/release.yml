name: Release

# One release per version: pushing a `vX.Y.Z` tag builds the app once, publishes
# the GitHub release, and bumps the Homebrew cask. Ordinary pushes to main do not
# rebuild, so a published version's DMG (and its checksum) never changes.
# `workflow_dispatch` with dry_run builds and checksums without publishing anything.
# Two jobs: 'build' runs on macOS and Windows and uploads what each made as a workflow
# artifact — the dry run stops there, and those artifacts are what a tester downloads;
# 'publish' collects both, checksums everything and makes the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and checksum only; publish nothing
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            name: mac
          - os: windows-latest
            # x64 explicitly: the artifact names below carry the arch (package.json artifactName).
            target: --win --x64
            name: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out app repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          if [ "$DRY_RUN" != "true" ] && [ "v${VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # electron-builder auto-publishes when it detects CI; the publish job
        # handles the release itself.
        run: npm run build -- ${{ matrix.target }} --publish never

      - name: Keep only the installable files
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p out
          case "${{ matrix.name }}" in
            mac)     cp "dist/Bubble-${VERSION}-arm64.dmg" "dist/Bubble-${VERSION}-arm64-mac.zip" out/ ;;
            windows) cp "dist/Bubble-${VERSION}-x64-setup.exe" "dist/Bubble-${VERSION}-x64-portable.exe" out/ ;;
          esac
          ls -l out

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out app repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksum the artifacts
        id: sums
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          cd dist
          sha256sum "Bubble-${VERSION}-arm64.dmg" "Bubble-${VERSION}-arm64-mac.zip" \
            "Bubble-${VERSION}-x64-setup.exe" "Bubble-${VERSION}-x64-portable.exe" | tee SHA256SUMS
          echo "dmg=dist/Bubble-${VERSION}-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v${VERSION}"
          ASSETS=(
            "dist/Bubble-${VERSION}-arm64.dmg"
            "dist/Bubble-${VERSION}-arm64-mac.zip"
            "dist/Bubble-${VERSION}-x64-setup.exe"
            "dist/Bubble-${VERSION}-x64-portable.exe"
            "dist/SHA256SUMS"
          )

          # Release notes: the changelog's top section (this version), not the whole file.
          awk '/^## /{ if (seen) exit; seen = 1; next } seen' CHANGELOG.md > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Bubble for Messenger ${VERSION}" --notes-file release-notes.md
          fi

      # The tap token is exposed to this one step only (the `secrets` context is not
      # allowed in a step `if`, hence the probe writing an output).
      - name: Is the tap token configured?
        id: tap
        run: echo "enabled=${{ secrets.HOMEBREW_TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap cask
        if: ${{ steps.tap.outputs.enabled == 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash .github/scripts/update-homebrew-tap.sh "${{ needs.build.outputs.version }}" "${{ steps.sums.outputs.dmg }}"
