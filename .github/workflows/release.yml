name: Release

# One release per version: pushing a `vX.Y.Z` tag builds the app once, publishes
# the GitHub release, and bumps the Homebrew cask. Ordinary pushes to main do not
# rebuild, so a published version's DMG (and its checksum) never changes.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Exposed at job level so the step below can gate on it: the `secrets`
      # context is not allowed in a step `if`, but `env` is.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Check out app repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read app version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          if [ "v${VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS app
        # electron-builder auto-publishes when it detects CI; the upload step
        # below handles the release itself.
        run: npm run build -- --publish never

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          DIST_DIR="dist"
          ASSET_DMG="${DIST_DIR}/Bubble-${VERSION}-arm64.dmg"
          ASSET_ZIP="${DIST_DIR}/Bubble-${VERSION}-arm64-mac.zip"

          # Release notes: the changelog's top section (this version), not the whole file.
          awk '/^## /{ if (seen) exit; seen = 1; next } seen' CHANGELOG.md > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_DMG" "$ASSET_ZIP" --clobber
          else
            gh release create "$TAG" "$ASSET_DMG" "$ASSET_ZIP" --title "Bubble for Messenger ${VERSION}" --notes-file release-notes.md
          fi

      - name: Update Homebrew tap cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: bash .github/scripts/update-homebrew-tap.sh "${{ steps.version.outputs.version }}"
