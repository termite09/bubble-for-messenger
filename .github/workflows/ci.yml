name: CI

# Tests on every push and pull request. They exercise the pure modules and a few main-process
# modules with fakes, so no Electron binary is needed (--ignore-scripts skips its download).
# Windows runs them too: a hard-coded '/' or a line-ending-sensitive test fails here before
# it fails a user.
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx eslint .
